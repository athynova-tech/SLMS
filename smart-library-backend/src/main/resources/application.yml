server:
  port: 8081

spring:
  application:
    name: smart-library-backend

  datasource:
    url: jdbc:h2:mem:smartlibrary
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

# JWT Configuration
jwt:
  secret: "QUIxQ0RFRjAxMjM0NTY3ODkwQUJDREVGQUIxQ0RFRjAxMjM0NTY3ODkwQUJDREVGQUIxQ0RFRjAxMjM0NTY3OA=="
  expiration: 86400000  # 24 hours

logging:
  level:
    com.smartlibrary: DEBUG
    org.springframework.security: INFO
