server:
  port: 8081

spring:
  application:
    name: smart-library-backend
  profiles:
    default: dev          # run with SPRING_PROFILES_ACTIVE=prod for production
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

# JWT: the secret has NO default here on purpose. Dev gets one from application-dev.yml;
# any other profile must provide JWT_SECRET (Base64, 32+ bytes), otherwise the app refuses to start.
jwt:
  secret: ${JWT_SECRET}
  expiration: 1800000            # access token: 30 minutes
  refresh-expiration: 604800000  # refresh token: 7 days

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.smartlibrary: INFO
    org.springframework.security: INFO
