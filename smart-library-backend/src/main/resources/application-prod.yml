# Production profile: MySQL, no demo data, no H2 console. All secrets come from environment variables.
#   SPRING_PROFILES_ACTIVE=prod
#   DB_URL=jdbc:mysql://host:3306/smartlibrary   DB_USERNAME=...   DB_PASSWORD=...
#   JWT_SECRET=<base64, 32+ bytes>   CORS_ALLOWED_ORIGINS=https://your-frontend
#   ADMIN_EMAIL / ADMIN_PASSWORD (12+ chars) to create the first admin on an empty database
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      # TODO: replace with Flyway migrations and use "validate". "update" is only a stop-gap.
      ddl-auto: update

app:
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
